resolver 127.0.0.11 valid=10s ipv6=off;

# G.β.2 — resolve the REAL client behind the host-Apache → docker-nginx chain.
# nginx's immediate peer is the docker bridge gateway (172.25.0.1); the real
# client is the entry host-Apache appends to X-Forwarded-For. `real_ip_recursive`
# walks XFF right-to-left, stripping trusted hops, and STOPS at the first
# untrusted entry — the real client. Trusting ONLY the bridge subnet + loopback
# means a client-spoofed leftmost XFF is never reached (spoof-proven, Wα Lane B).
# Declared at http scope so $binary_remote_addr in the zones below keys on the
# resolved client (per-client budgets, not one shared global bucket).
set_real_ip_from 172.16.0.0/12;   # docker bridge networks (peer = gateway, e.g. 172.25.0.1)
set_real_ip_from 127.0.0.1;       # loopback
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_compute:10m rate=2r/s;

server {
    listen 80;

    set $backend_upstream backend:8000;
    set $frontend_upstream frontend:80;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/(equations/(compute|simplify)|images/[^/]+/extract-contour|contours/[^/]+/compute/) {
        # G.β.2: burst 3→5. Under `real_ip` this zone is now PER-CLIENT, and one
        # legit compute cycle fires extract-contour + computeBases in parallel,
        # with a 2nd debounced cycle ~1s later → up to 4 near-simultaneous hits;
        # burst=3 would 503 a single honest user.
        limit_req zone=api_compute burst=5 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # post-real_ip = the real client
        proxy_set_header X-Forwarded-For $remote_addr;    # collapse to the single trusted value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # post-real_ip = the real client
        proxy_set_header X-Forwarded-For $remote_addr;    # collapse to the single trusted value
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # F.W1 — route FastAPI's root-served doc endpoints to the backend, not the SPA.
    location = /openapi.json { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
    location = /docs         { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
    location = /redoc        { proxy_pass http://$backend_upstream; proxy_set_header Host $host; }
    location = /health       { default_type application/json; return 200 '{"status":"ok"}'; }
    # inv-22 check #1: the bare root must NOT serve the SPA index on the API host.
    location = /             { default_type application/problem+json; return 404 '{"type":"about:blank","title":"Not Found","status":404}'; }

    # Frontend SPA
    location / {
        proxy_pass http://$frontend_upstream;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
}
