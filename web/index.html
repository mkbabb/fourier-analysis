<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Fourier Analysis</title>
        <meta name="description" content="An interactive treatise on Fourier analysis and orthogonal decomposition — epicycle visualizations, an equation explorer, and a full typeset paper deriving the transform through the dual lenses of linear algebra and complex analysis." />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

        <!-- Preload the critical CM Serif body + bold faces (used on every page).
             Same-origin, vendored under /public/fonts — no crossorigin attribute. -->
        <link rel="preload" href="/fonts/Serif/cmunrm.woff" as="font" type="font/woff" />
        <link rel="preload" href="/fonts/Serif/cmunbx.woff" as="font" type="font/woff" />
        <link rel="preload" href="/fonts/Serif/cmunti.woff" as="font" type="font/woff" />

        <!-- Self-hosted webfonts: Computer Modern Serif body face + Fraunces
             (display) + Fira Code (mono). KaTeX CSS is bundler-imported in
             main.ts (fingerprinted, same-origin). Zero third-party origins. -->
        <link rel="stylesheet" href="/fonts.css" />

        <script>
            // Init dark mode before first paint to prevent flash
            // Checks both legacy key ("theme") and VueUse key ("vueuse-color-scheme")
            (function() {
                var legacy = localStorage.getItem("theme");
                var vueuse = localStorage.getItem("vueuse-color-scheme");
                var saved = vueuse || legacy;
                if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
