# D.W6 — CI workflow.
#
# Four jobs run on push / PR against the default branch (the fourth added by
# X·F F.W9 `.c`, `G-F9-17`):
#
#   1. api-tests      — uv run pytest api/tests/ with an ephemeral Mongo
#                       service container so the ~82 @requires_mongo
#                       decorators actually exercise live Mongo (instead of
#                       silently skipping as they do without the service).
#                       Target floor: 211 passed (the 129 always-on + the
#                       formerly-skipped 82 now-running). A small honest
#                       residual is acceptable for tests that legitimately
#                       require replica-set topology.
#
#   2. web-build      — vue-tsc + vite build. Cheap; no Mongo needed.
#
#   3. e2e-tests      — Playwright against the local Vite dev server, with
#                       the backend launched under COMPUTE_RATE_LIMIT=1000 so
#                       the contour-extraction suite doesn't 429-cascade.
#                       Mongo service container provided here too so the
#                       backend can boot cleanly.
#
#   4. inv-27-evidence — X·F F.W9 `.c`, `G-F9-17`. Mints ONE durable, citable
#                       record — run id, run attempt, covering commit SHA, and
#                       every gating job's own conclusion — and mints it ONLY
#                       for a run in which all three concluded `success`. It
#                       is what makes *"cite a covering green run id"* an act
#                       a later seat can perform instead of assert.
#
# Residual: the workflow is not yet wired into a `secrets:` block — there are
# no inbound credentials needed for the test runs themselves (no deploy step;
# no external API calls). If a future arm needs secrets (e.g. webhook deploy
# token), this is the spot to add `secrets:` config.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  api-tests:
    name: api/tests (with live Mongo)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # NO submodules: `docs/precepts` (private mkbabb/precepts) is docs-only,
      # inaccessible to the Actions token, and read by no test/build — fetching it
      # was the chronic that kept every CI run red.
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install Python deps
        # pytest/ruff/mypy live in the `dev` extra (pyproject `[project.optional-dependencies]`),
        # NOT `web` — without `--extra dev` `uv run pytest` fails "Failed to spawn: pytest".
        # Mirror the Dockerfile dev stage (`uv sync --frozen --extra web --extra dev`).
        run: uv sync --extra web --extra dev
      - name: Run api tests
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
          MONGO_URI: mongodb://localhost:27017/fourier
        # H.W1 (inv-27 — green-means-green): collect the FULL api/ test tree, NOT
        # just api/tests/. The previous `pytest api/tests/` silently skipped
        # `api/services/__tests__/` (test_janitor.py, test_contour_hash.py) — so
        # CI was green while 5 janitor tests had been broken since B.W3 (a stub
        # drift CI never ran). `pytest api/` gates EVERY api test; no test lives
        # outside the collected path. A small @requires_mongo replica-set-only
        # skip residual is acceptable, but breakage can no longer hide off-path.
        run: uv run pytest api/ -v --tb=short

  web-build:
    name: web (vue-tsc + vite build)
    runs-on: ubuntu-latest
    steps:
      # NO submodules: `docs/precepts` (private mkbabb/precepts) is docs-only,
      # inaccessible to the Actions token, and read by no test/build — fetching it
      # was the chronic that kept every CI run red.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      # ── THE UNIT BLOCK RUNS FIRST (X·F F.W9 `.b`, `G-F9-1`) ──────────────
      #
      # It used to run LAST, after the type-check and both lint gates. Neither
      # unit step depends on any of them — they need `node_modules` and nothing
      # else, and together they take under a second. Sitting behind three
      # blocking gates meant that on every run where an EARLIER gate was red,
      # the unit population did not run at all: the job stopped above it. At
      # the bytes this wave opened on, `npm run lint` was red on three
      # `no-duplicate-imports` findings owned by F.W3/W4 — so the floor's own
      # claim, *"the spec population runs in CI"*, was false in practice while
      # every step was configured correctly.
      #
      # Moving the cheapest, most independent gates to the front is fail-fast,
      # not leniency: nothing is `continue-on-error`, nothing is skipped, and a
      # red unit run stops the job here exactly as a red lint run stops it
      # below. The order changes WHICH signal arrives first, never whether the
      # job fails.
      - name: Unit-runner seat (X·F F.W0, G-9)
        working-directory: web
        # `PP-NOTEST (= L-13) ≡ R-20 ≡ fr-App C-13`: `web/` has no unit runner,
        # and probe-C1b-class defects (valid-and-wrong output — the `PP-LEN`
        # shape) are catchable by nothing else. R-20 proves Playwright cannot
        # substitute.
        #
        # F.W0 owns the SEAT; F.W9's `G-F9-1` owns the FLOOR (the spec
        # population and its thresholds). This is ONE asserting spec proving the
        # seat live and is explicitly NOT coverage — neither gate may be
        # discharged by the other's evidence.
        #
        # The runner is Node's built-in one: already installed (it ships with
        # the Node this job provisions), already typed by `@types/node` (in the
        # lock), and therefore already inside the `vue-tsc` scope G-8 widened —
        # all three of G-9's clauses with ZERO manifest bytes. Requires Node
        # >= 22.6 for `--experimental-strip-types`; `node-version: "22"` above
        # resolves to the latest 22.x.
        run: node --test --experimental-strip-types e2e/unit/figure-dimensions.unit.ts
      - name: Unit floor (X·F F.W4 G-F4-VITEST + F.W9 G-F9-1)
        working-directory: web
        # ONE step, TWO gates, and neither is erased by the other: F.W4's
        # `G-F4-VITEST` stood the vitest runner up and wired this step; F.W9's
        # `G-F9-1` lands the FLOOR on top of it — the population and its
        # thresholds. F.W4's landed gate keeps its name here for that reason.
        #
        # THE FLOOR, and its two halves stated where they run.
        #
        # POPULATION — three globs, declared in `vitest.config.ts` and asserted
        # by `e2e/unit/unit-floor-population.vitest.ts`:
        #   `e2e/unit/**/*.vitest.ts` · `scripts/**/*.vitest.ts` ·
        #   `src/**/*.test.ts`.
        # The third was added by this wave. X.F.W3 `.e`'s three `src/lib`
        # vitest files matched NO runner's glob — not this one, not the
        # `node:test` seat above, not Playwright — so three files of real
        # assertions ran in no job at all and nothing reported it. The floor
        # went 8 files / 57 tests → 12 files / 80 tests when the glob closed.
        #
        # THRESHOLDS — blocking, and asserted rather than described:
        #   · no `continue-on-error`, no `--passWithNoTests`: an empty run is a
        #     RED run, so a glob that stops matching cannot read as success;
        #   · the population itself is an assertion — add a test file no runner
        #     claims and this step reddens on that fact alone. Measured:
        #     seeding `e2e/orphan-probe.vitest.ts` turned the step red with the
        #     orphan named, and removing it turned it green again.
        #
        # ⊘ TWO RUNNERS, DISCLOSED RATHER THAN SMOOTHED. The step above is
        # F.W0's `G-9` SEAT (`node:test`, zero manifest bytes — that wave could
        # not write `web/package.json`). Re-homing its assertions here would
        # discharge a closed wave's landed gate with this wave's runner, which
        # `F-W9.md` §2.4's RUNNER-SEAT DISJOINTNESS (R-5) forbids in as many
        # words. The population assertion knows about the seat and counts its
        # file as claimed, so the coexistence is measured, not assumed.
        run: npm test
      - name: Type-check
        working-directory: web
        # X·F F.W0 (G-7 + G-8) — this one command now carries three gates that
        # did not exist before the wave:
        #   • G-7 the unused-code gate — `noUnusedLocals` + `noUnusedParameters`
        #     in `web/tsconfig.json`. `MG-θ` books an entire defect family behind
        #     their absence; the flags ARE the gate, and `vue-tsc` is what runs
        #     them, so wiring is by construction here.
        #   • G-8 the SCOPE widening — `include` now reaches `vite.config.ts`,
        #     `playwright.config.ts` and `e2e/**/*.ts`. `PP-TSSCOPE`: the only
        #     type gate in this repo never checked its own build config or its
        #     own test suite.
        #   • the DELETIONS the flags surface route to F.W3/W4 — landing the
        #     gate is this wave's act, driving it is theirs.
        run: npx vue-tsc -b --force
      - name: Lint floor (X·F F.W0, G-7)
        working-directory: web
        # FR-IC-25 — an unwired gate is an ornament, so the floor lands here and
        # not in a README. It runs through `npx` at an EXACT pin because
        # `web/package.json` is reserved to F.W0's unit *a* (§2b) and a
        # devDependency is a manifest byte this wave may not write; the repo
        # already invokes its toolchain this way (`npx vue-tsc`, `npx vite`,
        # `npx playwright`). oxlint is zero-config by design, which is what makes
        # it landable without an `eslint.config.*` byte either.
        #
        # FLOOR SEMANTICS, STATED SO NOTHING IS MASKED: this fails the job on a
        # `correctness`-category ERROR. The first run over the settled tree found
        # **0 errors and 18 warnings across 141 files** (measured 2026-09-17,
        # double-run); every one of the 18 is enumerated in
        # `docs/tranches/F/SUBSTRATE-LEDGER.md` §3 and routed — none is
        # suppressed, allowlisted or disabled. Tightening to `--deny-warnings`
        # is F.W9/W10's act, together with the `lint` npm script (§6b: "the lint
        # script as a CI gate" is the W9/W10 half).
        #
        # ── X·F F.W9 `.b` (`G-F9-2` · §2.4's `M7` row): THE TIGHTENING, TAKEN ──
        #
        # The routing above is discharged here. It had to be, because the floor
        # as it stood could not fail on anything oxlint grades a WARNING, which
        # is most of what oxlint finds: measured 2026-09-19, seeding a duplicate
        # object key into a checked file produced *"Found 1 warning and 0
        # errors"* and **exit 0**. A gate that reports a real defect and exits 0
        # is the ornament `FR-IC-25` names, so the 0-errors/18-warnings reading
        # above was a reading of a step that could not redden.
        #
        # `--deny-warnings` makes every finding blocking. No `--allow`, no
        # ignore file, no rule disabled, no `continue-on-error` — the only way
        # this step goes green is the sites being cured.
        #
        # BORN-RED, WITH THE ROSTER PUBLISHED RATHER THAN HIDDEN. Seven findings
        # remain at the settled bytes (measured 2026-09-19, double-run), all in
        # `web/src/**` — product source, which F.W9 does not own (*"F.W9 owns
        # GATES. F.W9 owns no CURE."*). Each routes to whichever wave next opens
        # its file:
        #   · `eslint(no-unused-expressions)` ×4 —
        #       `components/equation/ConvergencePlot.vue:312,331,345`
        #       `components/visualization/GalleryView.vue:148`
        #   · `eslint-plugin-unicorn(no-new-array)` ×2 —
        #       `lib/svg-fourier.ts:44,179`
        #   · `eslint-plugin-unicorn(no-useless-fallback-in-spread)` ×1 —
        #       `lib/api.ts:188`
        # The three findings this floor convicted inside `web/e2e/` — F.W9's own
        # surface — were CURED before the flag landed
        # (`workspace-flow.spec.ts`'s non-null assertions on optional chains);
        # `oxlint e2e` now reads *"Found 0 warnings and 0 errors"*.
        run: npx --yes oxlint@1.42.0 --deny-warnings src e2e vite.config.ts playwright.config.ts
      - name: Keyed-loop + duplicate-import gate (X·F F.W4, G-F4-NO-UNUSED)
        working-directory: web
        # The ESLint leg of `G-F4-NO-UNUSED`. The gate's OTHER leg —
        # `noUnusedLocals`/`noUnusedParameters` on the shared tsconfig — landed
        # at F.W0 `b3b736c` and runs in the `Type-check` step above; F.W4 claims
        # no credit for it (`greenBeforeCure` #1). This step lands the half the
        # gate still owed: `vue/require-v-for-key` + `no-duplicate-imports` over
        # `web/src`, wired, blocking.
        #
        # ⊘ oxlint is NOT replaced. It is zero-config and correctness-scoped and
        # parses no Vue template AST, so it can carry neither of these two rules.
        # Both floors run; neither discharges the other.
        #
        # BORN-RED BY DESIGN, and the roster is published rather than hidden:
        # 10 `no-duplicate-imports` errors and 0 `vue/require-v-for-key` errors
        # at the settled bytes (measured 2026-09-18, double-run). Each of the 10
        # is routed by path to its owning unit in
        # `<vjs>/docs/tranches/X/execution/C/F-W4.md` §`.g`. No `eslint-disable`,
        # no `--max-warnings`, no `continue-on-error` — the step goes green when
        # the sites are cured, and by no other means.
        run: npm run lint
      - name: Deriver census (X·F F.W4, G-F4-DERIVER)
        working-directory: web
        # The gate's verb is PUBLISH: *"the deriver publishes: native-loop count
        # BY DIRECTIVE with bounds + multiplicity, `:is` candidate sets,
        # producer-internal loops from first-party d.ts, `url(#id)` edges,
        # enclosing disclosure state, loop-source provenance"*. This step is the
        # publication — the census lands in the job log of every run, so a later
        # wave reads a dated figure instead of re-deriving one.
        #
        # ⊘ IT IS AN INSTRUMENT, NOT A GATE, AND THE DISTINCTION IS DELIBERATE.
        # It has no pass/fail semantics to mask, so there is nothing here for a
        # `continue-on-error` to hide — and none is used: if the deriver itself
        # throws, this step fails, because a census that cannot be produced is
        # worse than one that reports badly. The ASSERTIONS about its output
        # live in `scripts/derive-loops.vitest.ts` and run in the blocking unit
        # floor above.
        run: npm run derive:loops
      - name: Build
        working-directory: web
        run: npm run build

  e2e-tests:
    name: e2e (Playwright, COMPUTE_RATE_LIMIT=1000)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # NO submodules: `docs/precepts` (private mkbabb/precepts) is docs-only,
      # inaccessible to the Actions token, and read by no test/build — fetching it
      # was the chronic that kept every CI run red.
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python deps
        run: uv sync --extra web
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Launch backend (COMPUTE_RATE_LIMIT harness)
        env:
          MONGO_URI: mongodb://localhost:27017/fourier
          # D.W6 — the e2e env raises compute_rate_limit via env var so the
          # 49-spec contour-extraction suite doesn't 429-cascade. The prod
          # api/config.py:23 default stays at 5; the override is env-only.
          COMPUTE_RATE_LIMIT: "1000"
          # H.W1 — the mutating e2e specs issue dozens of writes; raise the write
          # budget for the e2e arm (sibling of COMPUTE_RATE_LIMIT) so the suite
          # doesn't 429-cascade. Prod default (api/config.py write_rate_limit=10)
          # is byte-identical; the override is env-only.
          WRITE_RATE_LIMIT: "1000"
          # H.W1 — the upload handler's _blob_dir() mkdir's settings.blob_dir; the
          # prod default (/data/blobs) is NOT writable on the CI runner (creating
          # /data needs root), so every POST /api/images 500'd and the SPA never
          # navigated to /w/ — failing every upload-dependent spec. (The dead e2e
          # gate masked this under the older locator failure.) Point blobs at a
          # writable runner tmp dir for the e2e arm.
          BLOB_DIR: /tmp/fourier-e2e-blobs
          CORS_ORIGINS: "http://localhost:3000"
        run: |
          nohup uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "Backend healthy on :8000 (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"; cat /tmp/backend.log; exit 1
      - name: Launch vite dev server
        working-directory: web
        env:
          VITE_PROXY_API: "http://localhost:8000"
        run: |
          nohup npx vite --port 3000 --strictPort > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Vite serving on :3000 (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "Vite failed to start"; cat /tmp/vite.log; exit 1
      - name: Run Playwright e2e
        working-directory: web
        env:
          BASE_URL: "http://localhost:3000"
        # X·F F.W9 `.b` (`G-F9-13`): the matrix carries TWO cells now. The step
        # named only `chromium`, so adding the coarse project to the config
        # alone would have left it unrun — an instrument nobody invokes. Both
        # are named explicitly rather than by omission, so a third cell is a
        # deliberate edit here and not a silent inheritance.
        #
        # ⊘ `mobile-chromium` is Chromium under `Pixel 7` emulation. It
        # discharges NO Safari cell (`X-W11 G8`).
        run: npx playwright test --project=chromium --project=mobile-chromium --reporter=list
      - name: Tear down (always)
        if: always()
        run: |
          [[ -f /tmp/vite.pid ]] && kill "$(cat /tmp/vite.pid)" 2>/dev/null || true
          [[ -f /tmp/backend.pid ]] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ── X·F F.W9 `.c` — inv-27, THE EVIDENCE FLOOR ─────────────────────────────
  #
  # `F-W9.md` §2.7 states the wave's evidence law in one line: *"no gate closes
  # on an assertion that something did not run; every green cites a covering
  # run id"*. Before this job there was nothing to cite. A green gate row could
  # name a commit, and a reader could take the claim or leave it — which is
  # exactly the *green-by-assertion* posture the wave exists to abolish.
  #
  # WHAT IT EMITS, AND WHY THAT IS THE WHOLE JOB. The record carries the run
  # id, the run attempt, the covering commit SHA, the ref, and each gating
  # job's own conclusion. Every one of those values is READ FROM GitHub's
  # context — `github.run_id`, `github.sha`, `needs.<job>.result` — and not one
  # is computed here. That is deliberate and it is `KF.W4(d)` applied to this
  # wave's own instrument: **a gate may not re-derive its own oracle.** This job
  # serialises the oracle; it never becomes one.
  #
  # FAIL-CLOSED, TWICE. First by `needs:` — GitHub will not start this job
  # unless all three gating jobs concluded `success`, so a red run mints no
  # record at all. Second by the assertion step below, which re-reads the three
  # results and exits non-zero on anything but `success`. The second check is
  # redundant TODAY and is here on purpose: the day someone adds `if: always()`
  # to make the summary appear on red runs, the record does not quietly start
  # certifying failures — the job fails instead, loudly, naming the job that
  # was not green. A silent evidence forgery is the one failure mode an
  # evidence floor cannot survive.
  #
  # ⊘ NOTHING HERE IS `continue-on-error`, ALLOWLISTED OR SKIPPABLE, and the
  # JSON is parsed before it is uploaded: a record that cannot be read back is
  # worse than no record, so a malformed one fails the job rather than shipping.
  inv-27-evidence:
    name: inv-27 evidence (covering run id + SHA)
    runs-on: ubuntu-latest
    needs: [api-tests, web-build, e2e-tests]
    steps:
      - name: Assert the run is covering-green (fail-closed)
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          WEB_RESULT: ${{ needs.web-build.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          set -eu
          not_green=0
          for pair in "api-tests:${API_RESULT}" "web-build:${WEB_RESULT}" "e2e-tests:${E2E_RESULT}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            printf '%-12s = %s\n' "$job" "$result"
            [ "$result" = "success" ] || not_green=1
          done
          if [ "$not_green" -ne 0 ]; then
            echo "inv-27: this run is NOT covering-green — no evidence record is minted." >&2
            exit 1
          fi
          echo "inv-27: all three gating jobs concluded success."
      - name: Emit the inv-27 evidence record
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          WEB_RESULT: ${{ needs.web-build.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_EVENT: ${{ github.event_name }}
          GH_SERVER: ${{ github.server_url }}
        run: |
          set -eu
          run_url="${GH_SERVER}/${GH_REPO}/actions/runs/${GH_RUN_ID}"
          cat > inv-27-evidence.json <<JSON
          {
            "invariant": "inv-27",
            "claim": "green-means-green: this record exists only for a run in which every gating job concluded success",
            "emitted_by": "X.F.W9.c (G-F9-17)",
            "repository": "${GH_REPO}",
            "workflow": "${GH_WORKFLOW}",
            "run_id": "${GH_RUN_ID}",
            "run_number": "${GH_RUN_NUMBER}",
            "run_attempt": "${GH_RUN_ATTEMPT}",
            "run_url": "${run_url}",
            "covering_sha": "${GH_SHA}",
            "ref": "${GH_REF}",
            "ref_name": "${GH_REF_NAME}",
            "event": "${GH_EVENT}",
            "gating_jobs": {
              "api-tests": "${API_RESULT}",
              "web-build": "${WEB_RESULT}",
              "e2e-tests": "${E2E_RESULT}"
            }
          }
          JSON
          python3 -c 'import json,sys; json.load(open("inv-27-evidence.json")); print("inv-27: record parses")'
          {
            echo "## inv-27 — covering green run"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| run id | \`${GH_RUN_ID}\` |"
            echo "| run attempt | \`${GH_RUN_ATTEMPT}\` |"
            echo "| covering SHA | \`${GH_SHA}\` |"
            echo "| ref | \`${GH_REF_NAME}\` (${GH_EVENT}) |"
            echo "| api-tests | ${API_RESULT} |"
            echo "| web-build | ${WEB_RESULT} |"
            echo "| e2e-tests | ${E2E_RESULT} |"
            echo
            echo "Cite as: **run \`${GH_RUN_ID}\` @ \`${GH_SHA}\`** — ${run_url}"
          } >> "$GITHUB_STEP_SUMMARY"
          cat inv-27-evidence.json
      - name: Upload the inv-27 evidence record
        uses: actions/upload-artifact@v4
        with:
          name: inv-27-evidence
          path: inv-27-evidence.json
          retention-days: 90
