services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: development
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./src:/app/src
      - ./api:/app/api
      - ./assets:/app/assets
      # C.W5: the filesystem blob backend (invariant 18). Named volume for dev
      # parity with prod; the dev backend runs as root so a root-owned fresh
      # volume is writable here (the C2 app-ownership concern is prod-only,
      # handled by the production Dockerfile stage pre-creating /data/blobs).
      - image_blobs:/data/blobs
    environment:
      - CORS_ORIGINS=http://localhost:${WEB_PORT:-3000},http://localhost:5173
      - MONGO_URI=mongodb://${MONGO_USER:-fourier-admin}:${MONGO_PASSWORD:-fourier-dev-only}@mongo:27017/fourier?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    networks: [app-network]

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes:
      - ./web/src:/app/src
    environment:
      - VITE_PROXY_API=http://backend:8000
    networks: [app-network]

  mongo:
    image: mongo:8.0
    volumes: ["mongo_data:/data/db"]
    networks: [app-network]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-fourier-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-fourier-dev-only}
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-fourier-admin}", "-p", "${MONGO_PASSWORD:-fourier-dev-only}", "--authenticationDatabase", "admin", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  # C.W5: the image+thumbnail blob backend. Holds the SOLE copy of user uploads
  # post-cutover (the inline ``blob`` is ``$unset`` by the migration), so the
  # prod overlay declares it ``external: true`` (C4) to keep ``docker compose
  # down -v`` from wiping the only copy. See ``docker-compose.prod.yml``.
  image_blobs:
