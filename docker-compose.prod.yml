services:
  backend:
    build:
      target: production
    ports: !reset []
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://fourier.babb.dev}
      - MONGO_URI=mongodb://fourier-admin:cqC1rM9iGWw6xZoU5tFh4MqdQCvfvZBb@mongo:27017/fourier?authSource=admin&tls=true&tlsAllowInvalidCertificates=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    ports:
      - "27017:27017"
    command: ["mongod", "--tlsMode", "requireTLS",
              "--tlsCertificateKeyFile", "/etc/ssl/mongo.pem",
              "--tlsCAFile", "/etc/ssl/mongo-ca.pem",
              "--tlsAllowConnectionsWithoutCertificates",
              "--auth"]
    healthcheck:
      test: ["CMD", "mongosh", "-u", "fourier-admin", "-p", "cqC1rM9iGWw6xZoU5tFh4MqdQCvfvZBb",
             "--authenticationDatabase", "admin",
             "--tls", "--tlsAllowInvalidCertificates",
             "--eval", "db.runCommand('ping').ok", "--quiet"]
    volumes:
      - mongo_data:/data/db
      - ./ssl/mongo.pem:/etc/ssl/mongo.pem:ro
      - ./ssl/mongo-ca.pem:/etc/ssl/mongo-ca.pem:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8100}:80"]
    volumes:
      - ./nginx/fourier.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [app-network]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
