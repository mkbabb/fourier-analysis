services:
  backend:
    build:
      target: production
    ports: !reset []
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-https://fourier.babb.dev}
      - MONGO_URI=mongodb://${MONGO_USER:-fourier-admin}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set in production}@mongo:27017/fourier?authSource=admin&tls=true&tlsCAFile=/etc/ssl/mongo-ca.pem
    restart: unless-stopped
    volumes:
      # C.W5: the blob backend, read-write. The base compose declares the named
      # volume; the prod overlay re-pins it ``external: true`` (below) so the
      # sole copy of user uploads survives a ``down -v``.
      - image_blobs:/data/blobs
      # D.W2 (promoted from C/infra/tls.md §9 Edit 1): the CA cert, read-only —
      # the client validates the mongod server cert against this. Server-only
      # TLS: NO leaf cert is mounted here.
      - ./ssl/mongo-ca.pem:/etc/ssl/mongo-ca.pem:ro
    # G.W7 (ε.2) — hardening floor. The backend is health-gated (deploy-hook
    # auto-rolls-back a broken bring-up), so it carries the FULL floor: a
    # read-only root FS with tmpfs for the only writable runtime path (/tmp,
    # where UV_CACHE_DIR lives; /data/blobs is a rw volume, .venv is read-only),
    # all Linux caps dropped (a Python/uvicorn app on :8000 needs none), and
    # no-new-privileges to block setuid escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BASE_URL: ${VITE_BASE_URL:-/}
    ports: !reset []
    restart: unless-stopped
    # H.W4 (γ) — levelled UP to the constellation hardening FLOOR (was
    # no-new-privileges only; read_only + cap_drop were G.W7 BOOKED residuals).
    # This production stage is nginx:alpine serving the built SPA (web/Dockerfile
    # `FROM nginx:alpine AS production`, `listen 80`). An immutable root FS needs
    # the three writable paths a stock nginx-alpine touches mounted as tmpfs:
    #   /var/cache/nginx — proxy/fastcgi/client_body/scgi/uwsgi temp dirs.
    #   /var/run         — the master writes /var/run/nginx.pid here.
    #   /tmp             — scratch.
    # All Linux caps are dropped, then NET_BIND_SERVICE is added back (the master
    # binds the privileged :80). tmpfs is noexec,nosuid,size-capped per the
    # mkbabb/deploy docker-compose.hardening.yml canonical recipe.
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=16m
      - /var/run:noexec,nosuid,size=1m
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    # D.W1 Phase 1 security hotfix — Mongo is NOT published to the host.
    # The backend reaches mongo over the compose-network DNS name `mongo:27017`
    # (the existing `app-network` bridge — docker-compose.yml). The previous
    # `0.0.0.0:27017->27017/tcp` publish (NA5 §3.1 — externally TCP-reachable
    # on 34.197.214.67:27017) is closed. D.W2 closed the trust half: the three
    # permissive tls flags (the URI, the mongod cmd, the healthcheck) are gone,
    # the backend mounts the CA read-only, and the live connection performs
    # full chain + SAN verification against the fourier-internal-ca leaf.
    ports: !reset []
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-fourier-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?MONGO_PASSWORD must be set in production}
    # D.W2 honesty pivot: --tlsAllowConnectionsWithoutCertificates is NOT inert
    # under SCRAM-only auth in mongod 8.0. It is required because the client
    # (backend pymongo + the healthcheck mongosh) connects under server-only TLS
    # without presenting a client cert — without this flag, mongod rejects the
    # connection at the TLS handshake layer before SCRAM auth runs ("No SSL
    # certificate provided by peer; connection rejected"). The C/infra/tls.md §1
    # KISS-honesty note ("inert under SCRAM-only auth") was wrong on the live
    # mongod; this comment supersedes it for the promoted tls.md. The flag does
    # NOT make the trust posture weaker on the client side: pymongo still does
    # full chain + SAN verification via tlsCAFile.
    #
    # X·F F.W9 (G-F9-19) — verdict on the honesty pivot: SUSTAINED, and the
    # basis of that verdict is stated so it is not mistaken for a re-measurement.
    # The pivot is upheld on the mechanism, not as-running: mongo publishes no
    # port by design (D.W1), so the handshake cannot be probed from outside the
    # stack, and this seat has no route to the deployed stack. What IS decidable
    # here is the reasoning, and it holds — under server-only TLS the client
    # presents no certificate, so without this flag mongod rejects at the
    # handshake before SCRAM runs, and the client's own trust posture is carried
    # entirely by tlsCAFile. The superseded tls.md §1 "inert" note stays
    # superseded. If a future seat CAN reach a running mongod, re-measure the
    # handshake rather than inheriting this line.
    command: ["mongod", "--tlsMode", "requireTLS",
              "--tlsCertificateKeyFile", "/etc/ssl/mongo.pem",
              "--tlsCAFile", "/etc/ssl/mongo-ca.pem",
              "--tlsAllowConnectionsWithoutCertificates",
              "--auth"]
    # G.W7 (ε.2) — no-new-privileges is safe for the stateful DB. read_only is
    # impossible (mongod writes /data/db) and cap_drop needs verification against
    # mongod 8.0's runtime caps — BOOKED as a residual (staging test).
    #
    # X·F F.W9 (G-F9-19) — the two G.W7 ε.2 residuals, each given the explicit
    # verdict the gate demands instead of being carried forward a third time:
    #
    #   read_only  — DECLINED, PERMANENTLY. Not "not yet": mongod's dbPath must
    #     be writable, and WiredTiger also writes lock and diagnostic paths
    #     outside the /data/db volume. Enumerating those into tmpfs mounts is
    #     guesswork without a running instance to check against, and a
    #     mis-enumerated path yields a database that will not start. The
    #     security value is also the lowest of the four services: mongo
    #     publishes no port (D.W1) and is reachable only over app-network. The
    #     residual is CLOSED as declined-with-reason, not re-deferred.
    #
    #   cap_drop   — STILL BOOKED, and its blocker is now named rather than
    #     implied. The cure is unchanged (drop ALL, add back only what mongod
    #     8.0 actually needs) and it is decidable ONLY against a running
    #     instance — the same `docker inspect` capability G-F9-19 requires and
    #     this seat does not have (no daemon here; the deployed stack is on a
    #     host this seat has no route to). It is not landed blind, because a
    #     capability set guessed from documentation and shipped to a production
    #     database is the exact class of unverified hardening this gate exists
    #     to refuse. Owner: whoever next brings the stack up.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-fourier-admin}", "-p", "${MONGO_PASSWORD:?MONGO_PASSWORD must be set in production}",
             "--authenticationDatabase", "admin",
             "--tls", "--tlsCAFile", "/etc/ssl/mongo-ca.pem",
             "--eval", "db.runCommand('ping').ok", "--quiet"]
    volumes:
      - mongo_data:/data/db
      - ./ssl/mongo.pem:/etc/ssl/mongo.pem:ro
      - ./ssl/mongo-ca.pem:/etc/ssl/mongo-ca.pem:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8100}:80"]
    volumes:
      - ./nginx/fourier.conf:/etc/nginx/conf.d/default.conf:ro
    # X·F F.W9 (M.W2) — readiness ordering, not start ordering. The bare
    # `[backend, frontend]` form waits only for "container created", so the
    # gateway routinely came up before either upstream could answer and the
    # deploy's health gate absorbed the gap as elapsed poll time. The long form
    # blocks on each upstream's own HEALTHCHECK (api/Dockerfile,
    # web/Dockerfile), which is what `depends_on: service_healthy` means.
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [app-network]
    restart: unless-stopped
    # X·F F.W9 (M.W2) — the gateway's READINESS probe, and the reason it is not
    # the same shape as the two upstream LIVENESS probes. nginx's own liveness
    # is the static `location = /health` 200 it serves from its own config; that
    # 200 is true whether or not the backend exists, which is precisely why it
    # cannot be the readiness answer. Readiness here means "this gateway can
    # serve the API", so the probe goes THROUGH the proxy to /api/health. The
    # deploy hook asks the same two questions from outside the stack and reports
    # them apart; this is the in-stack half of the same separation.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # H.W4 (γ) — levelled UP to the constellation hardening FLOOR (was
    # no-new-privileges only; read_only + cap_drop were G.W7 BOOKED residuals).
    # Same nginx:alpine writable-path recipe as the frontend above: an immutable
    # root FS with tmpfs for the three paths a stock nginx-alpine writes
    # (/var/cache/nginx temp dirs, /var/run/nginx.pid, /tmp scratch). The mounted
    # fourier.conf is :ro and the master binds/proxies :80 — drop ALL caps, add
    # back only NET_BIND_SERVICE. tmpfs noexec,nosuid,size-capped per the
    # mkbabb/deploy docker-compose.hardening.yml canonical recipe.
    read_only: true
    tmpfs:
      - /var/cache/nginx:noexec,nosuid,size=16m
      - /var/run:noexec,nosuid,size=1m
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# C4 (C.W5): post-cutover ``image_blobs`` holds the SOLE copy of user uploads
# (the inline ``blob`` is ``$unset`` by the migration — the files are the new
# source of truth). Declaring it ``external: true`` means ``docker compose
# down -v`` does NOT wipe it — the cheap mechanical guard against an accidental
# total upload loss. An ``external`` volume is referenced by its literal name
# (NOT project-prefixed), so it must be created out-of-band once before the
# first prod bring-up: ``docker volume create image_blobs``. See the
# DR/consistency note for the second-durable-surface backup requirement.
volumes:
  image_blobs:
    external: true
